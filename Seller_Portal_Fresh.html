<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand Integer — Marketplace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{--bg:#f7f3ea;--card:#fffdf9;--line:#ddd5c5;--gold:#aa9563;--text:#292722;--muted:#827b6d;--green:#6d876c;--red:#a86d67;--shadow:0 8px 30px rgba(60,48,25,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif}
.top{background:#fffdf9;border-bottom:1px solid var(--line);padding:22px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-family:"Playfair Display",serif;font-size:31px;margin:0}.tag{font-family:"Playfair Display",serif;font-style:italic;color:var(--gold);font-size:16px;margin-top:3px}
.top-right{display:flex;gap:20px}nav a{color:var(--text);text-decoration:none;font-weight:500;border:1px solid var(--line);border-radius:12px;padding:10px 18px;transition:.18s}nav a:hover{border-color:var(--gold)}
.wrap{max-width:1280px;margin:auto;padding:34px 5% 70px}.eyebrow{letter-spacing:3px;color:#aaa18f;font-size:12px;font-weight:700;margin-top:8px}.title{font-family:"Playfair Display",serif;font-size:54px;margin:8px 0}.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);transition:.18s;cursor:pointer}.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.pic{width:100%;height:220px;background:#eee8dc;overflow:hidden;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:cover}
.card-body{padding:20px}.tag{display:inline-block;background:#f4efe5;color:#8d8576;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-bottom:10px}
h3{margin:10px 0 8px;font-family:"Playfair Display",serif;font-size:22px}.price{font-family:"Playfair Display",serif;font-size:28px;color:var(--gold);margin:10px 0}.meta{color:var(--muted);font-size:13px;margin:8px 0 15px}.courier{color:#a88d6a;font-size:12px;margin:10px 0}
.btn{border:1px solid var(--gold);background:#fffdf9;color:#7e6b43;border-radius:12px;padding:10px 15px;font-weight:600;cursor:pointer;transition:.18s}
.btn:hover{background:var(--gold);color:#fff}.btn.primary{background:#9f8957;color:#fff;border-color:#9f8957}
.btn.small{padding:8px 11px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(35,30,20,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}
.modalbox{max-width:720px;width:100%;background:#fffdf9;border-radius:24px;padding:26px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}h2{font-family:"Playfair Display",serif;font-size:30px;margin:0}
.close{border:0;background:transparent;font-size:28px;cursor:pointer;color:#999}
.field{margin:15px 0}.field label{display:block;margin-bottom:8px;font-weight:600}.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:14px}
.field textarea{resize:vertical;min-height:100px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee8dc}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv strong{text-align:right;flex:1;padding-left:15px}
.loading{text-align:center;padding:40px;color:#999}.empty{text-align:center;padding:60px 20px;color:#aaa}.modal-img{width:100%;max-height:300px;border-radius:12px;object-fit:contain;margin-bottom:20px}
@media(max-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.title{font-size:42px}.top{padding:18px 20px}.logo{font-size:26px}}
</style>
</head>
<body>

<header class="top">
  <div><h1 class="logo">Brand Integer</h1><div class="tag">Community Driven Growth Partner</div></div>
  <nav class="top-right"><a href="#sell">Sell</a><a href="#activity">My Activity</a></nav>
</header>

<main class="wrap">
  <div class="eyebrow">MARKETPLACE</div>
  <div class="title">Live Products</div>
  <p class="sub">Browse products from our community. Click any item to express interest.</p>
  
  <div id="products" class="grid"></div>
  <div id="loadingMsg" class="loading">Loading products...</div>
  <div id="emptyMsg" class="empty" style="display:none">No products available yet.</div>
</main>

<!-- Interest Modal -->
<div id="interestModal" class="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h2>Express Interest</h2>
      <button class="close" onclick="closeInterestModal()">&times;</button>
    </div>
    <form onsubmit="submitInterest(event)">
      <div class="field"><label>Your Name *</label><input required id="buyerName" type="text"></div>
      <div class="field"><label>WhatsApp Number *</label><input required id="buyerPhone" type="tel" placeholder="+91"></div>
      <div class="field"><label>Email</label><input id="buyerEmail" type="email"></div>
      <div class="field"><label>Delivery Address *</label><textarea required id="buyerAddress"></textarea></div>
      <div class="field"><label>City *</label><input required id="buyerCity" type="text"></div>
      <div class="field"><label>Pincode *</label><input required id="buyerPincode" type="text"></div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn primary" type="submit" style="flex:1">Send Enquiry via WhatsApp</button>
        <button class="btn" type="button" onclick="closeInterestModal()" style="flex:0">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxv9VFTrsSlia0oZ_gxpmBfTyL4z1IzZ6Za1JSQfHhTk3LnqOCNOpwP_Ki6FryditqG/exec';
let currentProduct = null;

async function loadProducts() {
  try {
    console.log('Fetching products from:', API_URL);
    const response = await fetch(API_URL + '?action=getProducts');
    const data = await response.json();
    
    console.log('API Response:', data);
    
    if (!data.ok || !data.products) {
      throw new Error('Invalid response from server');
    }

    const products = data.products || [];
    console.log('Products received:', products.length, products);
    
    const container = document.getElementById('products');
    const loading = document.getElementById('loadingMsg');
    const empty = document.getElementById('emptyMsg');
    
    if (products.length === 0) {
      container.style.display = 'none';
      loading.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    container.innerHTML = products.map((p, i) => {
      const img = (p.images && p.images.length > 0) ? p.images[0] : 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22220%22%3E%3Crect fill=%22%23eee%22 width=%22280%22 height=%22220%22/%3E%3C/svg%3E';
      return `
        <div class="card" onclick="openInterest(${i})">
          <div class="pic"><img src="${img}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22220%22%3E%3Crect fill=%22%23eee%22 width=%22280%22 height=%22220%22/%3E%3C/svg%3E'" alt="${p.name}"></div>
          <div class="card-body">
            <span class="tag">${p.category} · ${p.condition}</span>
            <h3>${p.name}</h3>
            <div class="price">₹${Number(p.price).toLocaleString('en-IN')}</div>
            <div class="meta"><strong>📍 ${p.location}</strong> · ${p.qty} available</div>
            <div class="courier">Courier charges extra · actual Delhivery charges or lower as per buyer discretion</div>
            <button class="btn small primary" onclick="openInterest(${i});event.stopPropagation()">Buy / Interested</button>
          </div>
        </div>
      `;
    }).join('');
    
    container.style.display = 'grid';
    loading.style.display = 'none';
    empty.style.display = 'none';
    
  } catch (err) {
    console.error('Error loading products:', err);
    document.getElementById('loadingMsg').innerHTML = '❌ Error loading products: ' + err.message;
  }
}

function openInterest(index) {
  const container = document.getElementById('products');
  const cards = container.querySelectorAll('.card');
  
  if (index >= 0 && index < cards.length) {
    const card = cards[index];
    const cardText = card.innerText;
    const lines = cardText.split('\n');
    
    currentProduct = {
      index: index,
      name: lines[1] || 'Product'
    };
    
    document.getElementById('interestModal').classList.add('open');
  }
}

function closeInterestModal() {
  document.getElementById('interestModal').classList.remove('open');
  currentProduct = null;
}

async function submitInterest(e) {
  e.preventDefault();
  
  if (!currentProduct) return;
  
  const container = document.getElementById('products');
  const products = JSON.parse(localStorage.getItem('_products') || '[]');
  const product = products[currentProduct.index];
  
  if (!product) {
    alert('Product not found');
    return;
  }
  
  try {
    const payload = {
      action: 'submitInterest',
      productId: product.id,
      productName: product.name,
      price: product.price,
      buyerName: document.getElementById('buyerName').value,
      buyerWhatsApp: document.getElementById('buyerPhone').value,
      buyerEmail: document.getElementById('buyerEmail').value,
      address: document.getElementById('buyerAddress').value,
      city: document.getElementById('buyerCity').value,
      pincode: document.getElementById('buyerPincode').value,
      sellerName: product.sellerName,
      sellerWhatsApp: product.sellerWhatsApp
    };
    
    console.log('Submitting interest:', payload);
    
    const response = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    
    const result = await response.json();
    console.log('Submit result:', result);
    
    if (result.ok) {
      alert('✓ Interest recorded! Seller will contact you on WhatsApp.');
      closeInterestModal();
      document.querySelector('form').reset();
    } else {
      alert('Error: ' + (result.error || 'Could not submit'));
    }
  } catch (err) {
    console.error('Error:', err);
    alert('Error: ' + err.message);
  }
}

// Store products in memory for later use
document.addEventListener('DOMContentLoaded', () => {
  loadProducts();
});

// Refresh every 10 seconds
setInterval(loadProducts, 10000);
</script>

</body>
</html>
